# Replica of qvac's pr-gate-merge.yml, reduced to the jobs that BLOCK a merge.
#
# Fidelity: the constructs under test are copied verbatim from qvac and are
# marked VERBATIM below. Everything else stands in for work the merge queue
# never interacts with. See design.md's fidelity table.
#
# `merge_group` is live on both gate workflows as of task 2.2 (test A1).
# The `changes` job below now carries the Phase 1 fix under test; A0 and A2
# recorded the behaviour before it.
name: Merge Guard

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - ready_for_review
    branches:
      - main
  # Added at task 2.2 (test A1). Mirrors the Phase 1 change the PRD
  # proposes for qvac: merge_group on pr-gate-merge.yml and
  # check-approvals.yml only. A0 measured the behaviour without it.
  merge_group:
  workflow_dispatch:

# VERBATIM from pr-gate-merge.yml:15-18
permissions:
  contents: read
  pull-requests: read
  packages: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Stands for qvac's fork-approval. The called workflow is byte-identical to
  # qvac's reusable-fork-approval.yml, including the environment expression at
  # its line 19 -- the expression that resolves to '' under merge_group, which
  # is the mechanism A6 measures.
  fork-approval:
    permissions:
      statuses: write
    uses: ./.github/workflows/reusable-fork-approval.yml

  # VERBATIM shape from pr-gate-merge.yml:36-58. Runs the real authorize-pr
  # action, checked out from the default branch, never from the pull request.
  # Its non-PR-event branch (authorize-pr/action.yml:76-79) is what A1 tests.
  authorize:
    needs: [fork-approval]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: read
    outputs:
      allowed: ${{ steps.auth.outputs.allowed }}
    steps:
      - name: Checkout authorize-pr (default branch)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/actions/authorize-pr
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Authorize
        id: auth
        uses: ./.github/actions/authorize-pr
        with:
          github-token: ${{ github.token }}

      - name: Record the authorize verdict (A1)
        run: |
          echo "A1_EVENT=${{ github.event_name }}"
          echo "A1_AUTHORIZE_ALLOWED=${{ steps.auth.outputs.allowed }}"

  # NO LONGER VERBATIM -- this job now carries the Phase 1 fix under test.
  #
  # qvac's original is `if: github.event_name == 'pull_request_target'`
  # (pr-gate-merge.yml:61). A0 and A2 measured that version: the job skips in a
  # merge group and takes build-a and build-b with it, so two of three guard
  # inputs green on nothing (A3).
  #
  # The fix must produce a real package list in a merge group, computed from
  # merge_group.base_sha..head_sha rather than the PR payload. Without it,
  # repairing build-c alone would leave the guard reporting success having
  # validated nothing, which is the actual risk A3 exposed.
  changes:
    if: github.event_name == 'pull_request_target' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.pkglist.outputs.packages }}
    steps:
      - name: Checkout for the merge-group diff
        if: github.event_name == 'merge_group'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build package list
        id: pkglist
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          echo "CHANGES_EVENT=${EVENT}"
          echo "CHANGES_MG_BASE=[${MG_BASE}]"
          echo "CHANGES_MG_HEAD=[${MG_HEAD}]"
          if [ "$EVENT" = "merge_group" ]; then
            # The merge group payload carries its own base and head, so the
            # diff needs no PR payload at all.
            changed=$(git diff --name-only "${MG_BASE}" "${MG_HEAD}")
          else
            changed=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')
          fi
          echo "CHANGES_FILES=[$(echo "$changed" | tr '\n' ' ')]"
          if echo "$changed" | grep -qv '^\.github/'; then
            packages='["probe"]'
          else
            packages='[]'
          fi
          echo "packages=${packages}" >> "$GITHUB_OUTPUT"
          echo "CHANGES_PACKAGES=${packages}"

  # Stands for qvac's sanity-checks (pr-gate-merge.yml:141-167).
  # VERBATIM condition from pr-gate-merge.yml:147.
  # Carries both qvac checkout shapes so A4a and A4b are observable.
  build-a:
    if: needs.authorize.outputs.allowed == 'true' && needs.changes.outputs.packages != '[]' && needs.changes.outputs.packages != ''
    needs: [authorize, changes, fork-approval]
    runs-on: ubuntu-latest
    steps:
      # SHAPE A4a -- VERBATIM from pr-gate-merge.yml:156-160: no `ref:` at all.
      - name: Checkout (shape=bare)
        id: bare
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          path: shape-bare

      # SHAPE A4b -- VERBATIM from sanity-checks/action.yaml:29-30: both
      # `repository` and `ref` resolve to empty strings under merge_group.
      # continue-on-error so a step failure is recorded as the A4b result
      # rather than aborting the job.
      - name: Checkout (shape=empty)
        id: empty
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: shape-empty

      - name: Report what each shape resolved to (A4a, A4b)
        run: |
          set -uo pipefail
          report() {
            local label="$1" dir="$2" outcome="$3"
            echo "SHAPE=${label} STEP_OUTCOME=${outcome}"
            if [ -d "$dir/.git" ]; then
              echo "SHAPE=${label} HEAD=$(git -C "$dir" rev-parse HEAD)"
              echo "SHAPE=${label} SUBJECT=$(git -C "$dir" log -1 --format=%s)"
              echo "SHAPE=${label} FORK_ONLY_FILE=$([ -f "$dir/fork-a0.txt" ] && echo present || echo absent)"
            else
              echo "SHAPE=${label} HEAD=<no checkout>"
            fi
          }
          report bare  shape-bare  "${{ steps.bare.outcome }}"
          report empty shape-empty "${{ steps.empty.outcome }}"

      # Deterministic failure lever. A marker on the merged tree fails this
      # job, which is how D1, D11 and D12 drive a red merge group without
      # touching the gate logic itself.
      # Configurable delay. Default 0 so the chain stays fast. A repo variable
      # PROBE_DELAY widens the window for the Phase C tests that must act while
      # an entry is still queued, and gives Phase D a measurable per-job
      # duration -- the open question in design.md.
      #
      # This is the ONE place a sleep is allowed. It is a test instrument, not
      # filler: without a duration, throughput numbers describe nothing.
      - name: Configurable delay
        env:
          DELAY: ${{ vars.PROBE_DELAY || '0' }}
        run: |
          echo "PROBE_DELAY=${DELAY}s"
          [ "${DELAY}" = "0" ] || sleep "${DELAY}"

      - name: Marker gate
        run: |
          if [ -f shape-bare/fail-build-a ]; then
            echo "::error title=build-a marker::fail-build-a present on the checked-out tree"
            exit 1
          fi
          echo "BUILD_A=pass"

      # Phase B / D1. A semantic conflict: every item-*.txt on the checked-out
      # tree must be named in allowlist.txt on that same tree.
      #
      # This is the class of failure a merge queue exists to catch. A pull
      # request cut before `b` was removed from the allowlist passes on its own
      # head, because its copy of the allowlist still lists `b`. Merged with a
      # base that has dropped `b`, it fails. Neither side is broken alone, so
      # it cannot be caught at pull request level -- which is exactly why round
      # 1's D1 attempt, poisoning main directly, could never be enqueued.
      - name: Allowlist gate (D1)
        run: |
          set -uo pipefail
          cd shape-bare
          test -f allowlist.txt || { echo "ALLOWLIST=absent, gate inert"; exit 0; }
          echo "ALLOWLIST_CONTENT=[$(tr '\n' ' ' < allowlist.txt)]"
          rc=0
          for f in item-*.txt; do
            [ -e "$f" ] || continue
            key="${f#item-}"; key="${key%.txt}"
            if grep -qx "$key" allowlist.txt; then
              echo "  ok   $f (key '"'"'$key'"'"' is allowed)"
            else
              echo "::error title=Disallowed item::$f carries key '"'"'$key'"'"', not in allowlist.txt on this tree"
              rc=1
            fi
          done
          echo "ALLOWLIST_GATE=$([ "$rc" -eq 0 ] && echo pass || echo fail)"
          exit "$rc"

  # Stands for qvac's verify-prebuilds (pr-gate-merge.yml:179-181).
  # VERBATIM condition from pr-gate-merge.yml:181 -- note it gates only on
  # `allowed`, not on the package list, so it skips for a different reason
  # than build-a. Both shapes feed the guard; that is why there are two.
  build-b:
    needs: [authorize, changes, fork-approval]
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    env:
      # VERBATIM shape from pr-gate-merge.yml:202,208 -- neither has a
      # fallback, so both are empty strings in a merge group. qvac feeds these
      # to prebuild-status/verify.mjs:44-45.
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_UPDATED_AT: ${{ github.event.pull_request.updated_at }}
      CHANGED_PACKAGES: ${{ needs.changes.outputs.packages || '[]' }}
    steps:
      - name: Report the verify-prebuilds inputs (A8)
        run: |
          echo "BUILD_B_EVENT=${{ github.event_name }}"
          echo "BUILD_B_HEAD_SHA=[${HEAD_SHA}]"
          echo "BUILD_B_PR_UPDATED_AT=[${PR_UPDATED_AT}]"
          echo "BUILD_B_CHANGED_PACKAGES=[${CHANGED_PACKAGES}]"
          echo "BUILD_B=pass"

  # Stands for qvac's sdk-pod-checks (pr-gate-merge.yml:214-220).
  # VERBATIM needs graph from pr-gate-merge.yml:215 -- note it does NOT depend
  # on `changes`. That is the whole reason this job exists: it is the only
  # build job that still RUNS when `changes` skips, so it is the one that
  # decides whether the guard fails or greens in a merge group.
  #
  # Its body reproduces the failure shape at pr-checks-sdk-pod.yml:103,126:
  # `set -euo pipefail` plus a fetch built from an empty PR number.
  build-c:
    needs: [authorize, fork-approval]
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    steps:
      # FIXED. Was `github.event.pull_request.base.sha || github.ref`, verbatim
      # from pr-checks-sdk-pod.yml:88. In a merge group the first operand is
      # empty and `github.ref` is the QUEUE BRANCH, so the "trusted base"
      # checkout silently read the merge-group tree -- defeating the
      # config-from-base anti-tampering property documented at
      # pr-checks-sdk-pod.yml:71-76. Measured in run 36867315234:
      # BUILD_C_RESOLVED_HEAD was the merge-group commit, not main.
      #
      # The merge group payload carries its own base, so name it explicitly
      # and never fall through to github.ref.
      - name: Checkout base
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect (mirrors the sdk-pod detect step)
        env:
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          echo "BUILD_C_EVENT=${EVENT}"
          echo "BUILD_C_PR_NUMBER=[${PR_NUMBER}]"
          echo "BUILD_C_RESOLVED_HEAD=$(git rev-parse HEAD 2>/dev/null || echo '<no checkout>')"
          # FIXED. Was an unconditional `git fetch origin refs/pull/${PR_NUMBER}/head`
          # (pr-checks-sdk-pod.yml:126). With an empty PR number that is
          # `refs/pull//head`, which exits 128 and, under `set -euo pipefail`,
          # takes the whole job. Measured in run 36867315234.
          #
          # A merge group needs no pull ref at all: base and head are both in
          # the payload.
          if [ "$EVENT" = "merge_group" ]; then
            echo "BUILD_C_DIFF_RANGE=[${MG_BASE}..${MG_HEAD}]"
            git fetch -q origin "${MG_BASE}" "${MG_HEAD}" 2>/dev/null || true
            changed=$(git diff --name-only "${MG_BASE}" "${MG_HEAD}")
          else
            echo "BUILD_C_DIFF_RANGE=[${BASE_SHA}...${HEAD_SHA}]"
            git fetch -q origin "refs/pull/${PR_NUMBER}/head"
            changed=$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")
          fi
          echo "BUILD_C_CHANGED=[$(echo "$changed" | tr '\n' ' ')]"
          echo "BUILD_C=pass"

  # VERBATIM from pr-gate-merge.yml:222-248, including both skipped-as-success
  # expressions. These are the subject of A3: in a merge group `changes` skips,
  # build-a and build-b skip with it, and each expression is predicted to
  # resolve `true` anyway.
  # ---------------------------------------------------------------------------
  # A7 secret probes. NOT part of the fidelity-mirrored chain -- these jobs have
  # no qvac counterpart and feed nothing into the guard. They exist only to
  # measure what a merge-group run can read.
  #
  # Values are never printed. Each step reports only whether the secret is
  # non-empty, because GitHub masks the value but not things derived from it.
  #
  # Deliberately no `needs:` so they run in a merge group regardless of the
  # `changes` outcome.
  # ---------------------------------------------------------------------------

  # A7a: repository-level secret read directly by the caller workflow. This is
  # qvac's actual shape -- pr-gate-merge.yml can reference secrets.* itself,
  # with no `secrets: inherit` anywhere.
  secret-probe-repo:
    runs-on: ubuntu-latest
    env:
      S: ${{ secrets.PROBE_SECRET }}
    steps:
      - name: Probe repo-level secret
        run: |
          echo "A7a_EVENT=${{ github.event_name }}"
          echo "A7a_REPO_SECRET_VISIBLE=$([ -n "$S" ] && echo yes || echo no)"
          echo "A7a_REPO_SECRET_LEN=${#S}"

  # A7c: environment-scoped secret. The environment is hard-coded here rather
  # than computed, unlike reusable-fork-approval.yml:19 whose expression
  # resolves to '' under merge_group (measured in A6). So this also answers a
  # second question: does an explicitly declared environment still gate a
  # merge-group run?
  # A7c is recorded (run 37276781053: env secret visible, and the hard-coded
  # environment DID gate). The `environment:` line is commented out now because
  # it gated EVERY subsequent merge-group run, adding a manual approval to each
  # test and inflating the fork-ci approval count that the PRD measures.
  # Restore it only to re-run A7c.
  secret-probe-env:
    runs-on: ubuntu-latest
    # environment: fork-ci
    env:
      S: ${{ secrets.PROBE_ENV_SECRET }}
    steps:
      - name: Probe environment-scoped secret
        run: |
          echo "A7c_EVENT=${{ github.event_name }}"
          echo "A7c_ENV_SECRET_VISIBLE=$([ -n "$S" ] && echo yes || echo no)"
          echo "A7c_ENV_SECRET_LEN=${#S}"

  # A7b: called workflow WITHOUT `secrets: inherit`. This is qvac's shape --
  # pr-gate-merge.yml:220,238 pass no secrets block at all.
  secret-probe-called-noinherit:
    uses: ./.github/workflows/reusable-secret-probe.yml
    with:
      label: A7b_NOINHERIT

  # A7d: identical call WITH `secrets: inherit`. The single variable under
  # test, and the thing round 1 added permanently rather than isolating.
  secret-probe-called-inherit:
    uses: ./.github/workflows/reusable-secret-probe.yml
    with:
      label: A7d_INHERIT
    secrets: inherit

  mq-guard:
    needs: [fork-approval, authorize, changes, build-a, build-b, build-c]
    if: |
      always() && !cancelled() &&
      (needs.changes.result == 'success' || needs.changes.result == 'skipped')
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/reusable-validate.yml
    with:
      sanity-checks-status: ${{ needs.fork-approval.result == 'success' && needs.authorize.result == 'success' && needs.authorize.outputs.allowed == 'true' && (needs.build-a.result == 'success' || needs.build-a.result == 'skipped') }}
      build-status: ${{ needs.fork-approval.result == 'success' && needs.authorize.result == 'success' && needs.authorize.outputs.allowed == 'true' && (needs.build-b.result == 'success' || needs.build-b.result == 'skipped') }}
      general-checks-status: ${{ needs.fork-approval.result == 'success' && needs.authorize.result == 'success' && needs.authorize.outputs.allowed == 'true' && (needs.build-c.result == 'success' || needs.build-c.result == 'skipped') }}
