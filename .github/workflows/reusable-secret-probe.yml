# A7b / A7d. Called twice from pr-gate.yml: once with `secrets: inherit` and
# once without, so the two cells differ in exactly one thing.
#
# A called workflow receives GITHUB_TOKEN automatically but gets NO other
# secret unless the caller passes it or inherits. qvac passes neither
# (pr-gate-merge.yml:220,238), which is why the PRD says the exposure is not
# live today.
#
# Values are never printed, only whether each is non-empty.
name: Secret probe (reusable)

on:
  workflow_call:
    inputs:
      label:
        required: true
        type: string

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      REPO_S: ${{ secrets.PROBE_SECRET }}
      ENV_S: ${{ secrets.PROBE_ENV_SECRET }}
    steps:
      - name: Probe
        run: |
          L='${{ inputs.label }}'
          echo "${L}_EVENT=${{ github.event_name }}"
          echo "${L}_REPO_SECRET_VISIBLE=$([ -n "$REPO_S" ] && echo yes || echo no)"
          echo "${L}_ENV_SECRET_VISIBLE=$([ -n "$ENV_S" ] && echo yes || echo no)"
