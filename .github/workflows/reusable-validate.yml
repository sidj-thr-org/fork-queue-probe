# Mirrors qvac's public-pr.yml `validate-pr` job.
#
# Called by pr-gate.yml's `mq-guard` job, so the check context it produces is
# `mq-guard / validate-pr` -- the context required by ruleset 23992023.
#
# Trimmed to the two inputs the replica drives. The `"" || != "true"` shape of
# each test is copied from qvac (public-pr.yml:56-67) unchanged, because that
# comparison is exactly what decides whether a skipped upstream job greens the
# gate. Changing it would change the answer to A3.
name: Validate PR

on:
  workflow_call:
    inputs:
      sanity-checks-status:
        required: false
        type: boolean
        description: "Stands for qvac's sanity-checks result"
        default: true
      build-status:
        required: false
        type: boolean
        description: "Stands for qvac's verify-prebuilds result"
        default: true
      general-checks-status:
        required: false
        type: boolean
        description: "Stands for qvac's sdk-pod-checks result"
        default: true

jobs:
  validate-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Check statuses
        run: |
          failed=0

          # Echoed for the A3 digest: these are the resolved values of the
          # caller's skipped-as-success expressions, read at the point of use.
          echo "GUARD_EVENT=${{ github.event_name }}"
          echo "GUARD_INPUT_sanity-checks-status=[${{ inputs.sanity-checks-status }}]"
          echo "GUARD_INPUT_build-status=[${{ inputs.build-status }}]"
          echo "GUARD_INPUT_general-checks-status=[${{ inputs.general-checks-status }}]"

          if [[ "${{ inputs.sanity-checks-status }}" != "" && "${{ inputs.sanity-checks-status }}" != "true" ]]; then
            echo "::error title=Sanity checks have not returned success::sanity-checks-status is not true"
            failed=1
          fi
          if [[ "${{ inputs.build-status }}" != "" && "${{ inputs.build-status }}" != "true" ]]; then
            echo "::error title=Build has not returned success::build-status is not true"
            failed=1
          fi
          if [[ "${{ inputs.general-checks-status }}" != "" && "${{ inputs.general-checks-status }}" != "true" ]]; then
            echo "::error title=General checks have not returned success::general-checks-status is not true"
            failed=1
          fi

          if [[ $failed -eq 1 ]]; then
            echo "GUARD_VERDICT=fail"
            exit 1
          fi
          echo "GUARD_VERDICT=pass"
